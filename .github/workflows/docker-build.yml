# Build the container image, publish it to GHCR, and tell Portainer to redeploy.
#
# Action versions are pinned by commit SHA rather than tag. A tag is a mutable
# pointer, and these actions run with a token that can write packages, so a
# retagged release would be an unreviewed change to something that can publish
# under this account. The trailing comment is the human-readable version.

name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly rebuild. The Dockerfile installs tzdata from Debian, and the IANA
    # zone database changes several times a year; an image built once would
    # keep cutting editions against whatever the rules were on build day.
    - cron: "24 0 * * 1"

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The image is gated on the suite rather than published alongside it. A
  # deploy is the one action here that is awkward to undo: Portainer recreates
  # the container, and a container that fails to answer /healthz is a service
  # outage, not a red tick on a commit.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The suite makes no network requests: HTTP responses are replayed from
      # tests/fixtures and the cache throws on a miss, so a test that grows a
      # live fetch fails here rather than passing until GitHub's egress or the
      # upstream site has a bad day.
      - name: Test
        run: bun test

  build-and-push-image:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # Both are for the keyless signing and provenance steps below: the OIDC
      # token is what cosign exchanges for a short-lived certificate, so there
      # is no long-lived signing key to leak.
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build needs the working tree, not the history. The commit SHA
          # comes from the workflow context, and src/health.ts reads it from
          # the GIT_SHA build arg rather than shelling out to git.
          fetch-depth: 1
          persist-credentials: false

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.0"

      # arm64 is emulated on the amd64 runner. This is the slow part of the
      # job, and it is the price of one image that runs on both a normal server
      # and the small arm boxes this kind of service usually lands on.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        # Skipped on pull requests, which cannot be given a token that writes
        # packages. The build below still runs, so a PR proves the Dockerfile
        # compiles without being able to publish anything.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=hacker-opds
            org.opencontainers.image.description=Top Hacker News stories as EPUBs over OPDS and articles over RSS, for e-ink readers

      # One source of truth for the runtime version. The Dockerfile keeps its
      # own default so a plain `docker build` still works, but CI passes the
      # file so the image and the job that tested it cannot drift apart.
      - name: Read Bun version
        id: bun
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # arm64 is emulated, and on a pull request the only question being
          # asked is whether the Dockerfile still builds, which one
          # architecture answers.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # src/health.ts prefers this over running git, which the image does
          # not contain. It is what /healthz reports as "git", and the only way
          # to tell which commit a running container was built from.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUN_VERSION=${{ steps.bun.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # Signing by digest rather than by tag: a tag can be moved afterwards,
        # a digest cannot, so this attests to the exact bytes that were built.
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          # Word splitting is the mechanism here, not an accident: cosign takes
          # the image references as separate arguments.
          # shellcheck disable=SC2086
          cosign sign --yes ${images}

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Deploy to Portainer
        # Only for pushes to main. A tag build publishes an image but does not
        # move what production runs, and the weekly rebuild produces an image
        # identical in every way that matters, so neither should trigger a
        # container recreation.
        #
        # The webhook URL is itself the credential, which is why it is a secret
        # and why the command is written so the URL never reaches the log.
        # --fail turns an HTTP error into a failed job; without it curl exits 0
        # after printing Portainer's error body and the deploy looks green.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "${PORTAINER_WEBHOOK_URL}" ]; then
            echo "PORTAINER_WEBHOOK_URL is not set; skipping deploy." >&2
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 120 \
            -X POST "${PORTAINER_WEBHOOK_URL}" \
            --output /dev/null
          echo "Portainer redeploy triggered."
